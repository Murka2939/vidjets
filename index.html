<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fliqlo Style Clock</title>
    <!-- подключаем стили и скрипты flipclock -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flipclock@0.7.8/dist/flipclock.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flipclock@0.7.8/dist/flipclock.min.js"></script>
    <style>
        body {
            background: #000000;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        .clock-container {
            transform: scale(1.2); /* чуть увеличим для эффектности */
        }
        /* подгоняем цвета и тени под Fliqlo */
        .flip-clock-wrapper {
            width: auto;
            text-align: center;
        }
        .flip-clock-divider .flip-clock-label {
            color: #aaa;
            font-size: 14px;
            bottom: -30px;
        }
        .flip-clock-dot {
            background: #fff;
            box-shadow: 0 0 5px #fff;
        }
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #222;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
            font-weight: bold;
        }
        .flip-clock-wrapper ul {
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
<div class="clock-container">
    <div class="clock"></div>
</div>

<script>
    $(document).ready(function() {
        // инициализация часов с форматом 24h, показываем часы и минуты
        var clock = $('.clock').FlipClock({
            clockFace: 'TwentyFourHourClock',
            showSeconds: false,   // у Fliqlo обычно секунд нет
            callbacks: {
                init: function() {
                    // после инициализации можно убрать надписи "hours", "minutes"
                    $('.flip-clock-label').hide();
                }
            }
        });
        // убираем стандартные надписи "hours", "minutes" — они нам не нужны
        setTimeout(function() {
            $('.flip-clock-label').remove();
        }, 100);
    });
</script>
</body>
</html>
